name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test
